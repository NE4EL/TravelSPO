<text x="710" y="650" font-size="12" fill="#171717" font-weight="normal" text-anchor="start">Расход связан только с мероприятием своей поездки.</text>
<text x="710" y="670" font-size="12" fill="#171717" font-weight="normal" text-anchor="start">Составной FK: (activity_id, trip_id)</text>
<text x="710" y="690" font-size="12" fill="#171717" font-weight="normal" text-anchor="start">→ activities(id, trip_id). Проверка при COMMIT.</text>
<text x="710" y="720" font-size="12" fill="#171717" font-weight="normal" text-anchor="start">При удалении мероприятия: activity_id = NULL.</text>
<text x="580" y="920" font-size="20" fill="#171717" font-weight="bold" text-anchor="middle">ER-диаграмма предметных таблиц TravelSPO</text>
<rect x="40" y="945" width="1080" height="95" rx="8" fill="#f6f8fb" stroke="#c5cfdd"/>
<text x="60" y="970" font-size="13" fill="#171717" font-weight="normal" text-anchor="start">PK — первичный ключ; FK — внешний ключ; UQ — уникальное значение или сочетание полей.</text>
<text x="60" y="995" font-size="13" fill="#171717" font-weight="normal" text-anchor="start">Стрелка: поле FK → поле PK. Точка — сторона FK; наконечник — сторона родительского ключа.</text>
<text x="60" y="1020" font-size="13" fill="#171717" font-weight="normal" text-anchor="start">Кратности: 0..N — от нуля до многих; 1 — ровно один; 0..1 — необязательное мероприятие.</text>
</svg>
