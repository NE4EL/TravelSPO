services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - trips:/var/lib/postgresql/data
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://travel:travel@db/travel
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8000"
volumes:
  trips:
